name: eval-gate

# The merge-blocking golden-trajectory eval (DECISIONS.md §4.1; DEPGUARD_V01_PLAN D7).
# The DETERMINISTIC arm blocks: it is fully reproducible and needs no API key, so it
# goes red the instant any core regresses (tools, oracle, verifier, evidence, graph,
# metrics). If the LLM_API_KEY secret is set, the multi_agent arm additionally runs
# (house rule 9) and must not drop correctness/groundedness below the committed
# baseline — but it never blocks on non-deterministic plan-metric noise.

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-v4-flash
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # empty ⇒ multi_agent arm is skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Golden-trajectory eval gate
        run: python scripts/run_eval.py check
