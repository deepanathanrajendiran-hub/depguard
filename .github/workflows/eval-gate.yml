name: eval-gate

# The merge-blocking golden-trajectory eval (DECISIONS.md §4.1).
# The DETERMINISTIC arm blocks: it is fully reproducible and needs no API key, so it
# goes red the instant any core regresses (tools, oracle, verifier, evidence, graph,
# metrics). If the LLM_API_KEY secret is set, the multi_agent arm additionally runs
# and must not drop correctness/groundedness below the committed
# baseline — but it never blocks on non-deterministic plan-metric noise.

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-v4-flash
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # empty ⇒ multi_agent arm is skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Deliberately a SEPARATE step from the gate below, because the two catch
      # disjoint bug classes and conflating them is what hid the hole. The gate
      # recomputes gold with the same functions the tools call, so an oracle sign flip
      # moves prediction and label together and correctness stays pinned at 1.0000
      # (measured: inverting the `fixed` bound flips 13 of 29 golden verdicts, incl.
      # the lodash 4.17.21 headline case, while correctness never moves). This table
      # is hand-derived from the OSV spec and is the only thing watching the oracle.
      - name: Oracle truth table (independent of the shared oracle)
        run: python -m pytest tests/test_oracle_truth.py -q
      - name: Golden-trajectory eval gate (orchestration regressions)
        run: python scripts/run_eval.py check
